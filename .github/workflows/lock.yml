# Based on the HashiCorp terraform-devex-repos template, with an explicit
# permissions block added for this repository:
# https://github.com/hashicorp/terraform-devex-repos
name: 'Lock Threads'

on:
  schedule:
    - cron: '43 20 * * *'

# The repository default token is read-only, so the lock API calls need an
# explicit grant.
permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # NOTE: When TSCCR updates the GitHub action version, update the template workflow file to avoid drift:
      # https://github.com/hashicorp/terraform-devex-repos/blob/main/modules/repo/workflows/lock.tftpl
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          process-only: 'issues, prs'
          github-token: ${{ github.token }}
          issue-inactive-days: '30'
          issue-lock-reason: resolved
          pr-inactive-days: '30'
          pr-lock-reason: resolved
