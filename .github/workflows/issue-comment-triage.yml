# Based on the HashiCorp terraform-devex-repos template, with an explicit
# permissions block and label tolerance added for this repository:
# https://github.com/hashicorp/terraform-devex-repos
name: Issue Comment Triage

on:
  issue_comment:
    types: [created]

# The repository default token is read-only, so editing labels needs an
# explicit grant.
permissions:
  contents: read

jobs:
  issue_comment_triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      # issue_comment events are triggered by comments on issues and pull requests. Checking the
      # value of github.event.issue.pull_request tells us whether the issue is an issue or is
      # actually a pull request, allowing us to dynamically set the gh subcommand:
      # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#issue_comment-on-issues-only-or-pull-requests-only
      COMMAND: ${{ github.event.issue.pull_request && 'pr' || 'issue' }}
      GH_TOKEN: ${{ github.token }}
      THREAD_URL: ${{ github.event.issue.html_url }}
    steps:
      - name: 'Remove waiting-response on comment'
        run: |
          set -uo pipefail
          if output="$(gh "${COMMAND}" edit "${THREAD_URL}" --remove-label waiting-response 2>&1)"; then
            echo "${output}"
            exit 0
          fi
          # The label is optional: it may be absent from the thread or from the
          # repository entirely, which is not a triage failure.
          if grep -q "'waiting-response' not found" <<<"${output}"; then
            echo "No waiting-response label to remove."
            exit 0
          fi
          echo "${output}" >&2
          exit 1
